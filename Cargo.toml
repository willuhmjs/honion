[workspace]
resolver = "3"
members = [
    "crates/honion-core",
    "crates/honion-gpu",
    "crates/honion-keyfile",
    "crates/honion-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/willuhmjs/honion"

[workspace.dependencies]
# Internal path deps carry an explicit version so `cargo publish` works;
# publish order is honion-core, then honion-gpu and honion-keyfile, then
# honion-cli (crates.io rejects a version bump whose dependencies are not
# yet published).
honion-core = { path = "crates/honion-core", version = "0.1.0" }
honion-gpu = { path = "crates/honion-gpu", version = "0.1.0" }
honion-keyfile = { path = "crates/honion-keyfile", version = "0.1.0" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
curve25519-dalek = { version = "4", features = ["rand_core"] }
ed25519-dalek = { version = "2", features = ["hazmat", "rand_core"] }
getrandom = "0.3"
rayon = "1"
sha3 = "0.10"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
